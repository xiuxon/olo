name: Update-over-old-release test (emulator)

# Generic update-path integrity test (API 30): install an OLD secure build,
# update in place to the NEW secure build, assert the app still opens
# (compiled-layer baseline re-record on versionCode change / dexfp on
# same-versionCode) and dump sa_integ / sa_crash after each leg.
#
# Inputs:
#   repo         - app repo holding the releases (owner/name)
#   package      - app package name
#   new_tag      - NEW secure release tag (blank = latest)
#   old4_tag     - OLD secure tag with a LOWER versionCode (rebaseline path)
#   old5_tag     - OLD secure tag with the SAME versionCode (dexfp path)
#   secure_asset - secure APK asset name (blank = auto-detect *secure*.apk)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'app repo holding the releases (owner/name)'
        required: true
      package:
        description: 'app package name'
        required: true
      new_tag:
        description: 'NEW secure release tag (blank = latest)'
        required: false
        default: ''
      old4_tag:
        description: 'OLD secure tag with a lower versionCode'
        required: true
      old5_tag:
        description: 'OLD secure tag with the same versionCode (dexfp path)'
        required: true
      secure_asset:
        description: 'secure APK asset name (blank = auto-detect *secure*.apk)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  updatetest:
    runs-on: ubuntu-latest
    env:
      APP_REPO: ${{ inputs.repo }}
      GH_TOKEN: ${{ startsWith(inputs.repo, 'xiuxon/') && secrets.REPO_TOKEN || secrets.EXT_REPO_TOKEN }}
      LOG_KEY: ${{ secrets.LOG_KEY }}
    strategy:
      fail-fast: false
      matrix:
        api-level: [30]
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download APKs
        run: |
          set -e
          TAGN="${{ inputs.new_tag }}"
          if [ -z "$TAGN" ]; then TAGN=$(gh api "repos/$APP_REPO/releases/latest" --jq .tag_name </dev/null); fi
          TAG4="${{ inputs.old4_tag }}"
          TAG5="${{ inputs.old5_tag }}"
          echo "new=$TAGN old4=$TAG4 old5=$TAG5"
          SEC="${{ inputs.secure_asset }}"
          mkdir -p apks/old4 apks/old5 apks/new
          if [ -z "$SEC" ]; then
            gh api --paginate "repos/$APP_REPO/releases/tags/$TAGN" --jq '.assets[].name' > /tmp/new_assets.txt
            SEC=$(grep -E 'secure.*\.apk$' /tmp/new_assets.txt | head -1)
            if [ -z "$SEC" ]; then
              echo "could not resolve secure apk for $TAGN; candidates were:"
              cat /tmp/new_assets.txt
              exit 1
            fi
          fi
          echo "secure asset=$SEC"
          gh release download "$TAG4" --repo "$APP_REPO" --pattern "$SEC" --dir apks/old4 </dev/null
          gh release download "$TAG5" --repo "$APP_REPO" --pattern "$SEC" --dir apks/old5 </dev/null
          gh release download "$TAGN" --repo "$APP_REPO" --pattern "$SEC" --dir apks/new </dev/null
          mv "apks/old4/$SEC" apks/old4/secure.apk
          mv "apks/old5/$SEC" apks/old5/secure.apk
          mv "apks/new/$SEC" apks/new/secure.apk
          ls -l apks/*/*.apk
          sha256sum apks/*/*.apk
      - name: Install log decrypt helper
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          set -e
          python3 -c "import cryptography" 2>/dev/null || { pip install --quiet cryptography || pip install --quiet --break-system-packages cryptography; }
          python3 -c "import cryptography" >/dev/null 2>&1 && echo "cryptography OK" || { echo "cryptography MISSING"; exit 1; }
          curl -fsSL -H "Authorization: token $REPO_TOKEN" \
            https://raw.githubusercontent.com/xiuxon/secure-app/main/tools/decrypt_log.py \
            -o /tmp/sa_dec.py && echo "decrypt helper fetched" || { echo "decrypt helper fetch FAILED"; exit 1; }
          cat > /tmp/gs.sh <<EOF
          #!/bin/sh
          # gs.sh <integ|crash|/path> <cmd...>
          case "\$1" in
            integ) R='/data/data/${{ inputs.package }}/files/sa_integ.txt' ;;
            crash) R='/data/data/${{ inputs.package }}/cache/Crash Reports/sa_crash.txt' ;;
            *)     R="\$1" ;;
          esac
          shift
          rm -f /tmp/gs_raw /tmp/gs_txt
          if ! adb pull "\$R" /tmp/gs_raw >/dev/null 2>&1; then
            echo "(missing: \$R)"
            exit 1
          fi
          if ! python3 /tmp/sa_dec.py /tmp/gs_raw > /tmp/gs_txt; then
            echo "(decrypt failed: \$R)"
            exit 1
          fi
          exec "\$@" /tmp/gs_txt
          EOF
          chmod +x /tmp/gs.sh
          echo "LOG_KEY set: $([ -n "$LOG_KEY" ] && echo yes || echo NO)"
          sh -n /tmp/gs.sh && echo "gs.sh syntax OK"
      - name: Install + update legs + capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -x
            adb wait-for-device
            adb shell getprop ro.build.version.sdk
            adb shell input keyevent 82 || true
            echo "======== LEG A: old secure -> new secure (versionCode CHANGES -> rebaseline path) ========"
            adb install apks/old4/secure.apk && echo OLD4_INSTALLED || echo OLD4_INSTALL_FAIL
            adb logcat -c || true; adb shell monkey -p ${{ inputs.package }} -c android.intent.category.LAUNCHER 1 || true; sleep 14; adb shell pidof ${{ inputs.package }} && echo OLD4_OK || echo OLD4_DEAD
            adb shell dumpsys package ${{ inputs.package }} | grep -E "versionCode|versionName" || true
            echo "-- sa_integ after OLD4 first open:"; /tmp/gs.sh integ cat || true
            adb install -r apks/new/secure.apk && echo UPD_OLD_TO_NEW_INSTALLED || echo UPD_OLD_TO_NEW_INSTALL_FAIL
            adb logcat -c || true; adb shell monkey -p ${{ inputs.package }} -c android.intent.category.LAUNCHER 1 || true; sleep 14; adb shell pidof ${{ inputs.package }} && echo UPD_OLD_TO_NEW_OK || echo UPD_OLD_TO_NEW_DEAD
            adb shell dumpsys package ${{ inputs.package }} | grep -E "versionCode|versionName" || true
            adb logcat -d -s AndroidRuntime:E | tail -n 40 || true
            adb logcat -d | grep -E "FATAL|AssertionError|secureapp" | tail -n 30 || true
            echo "-- sa_integ after update open:"; /tmp/gs.sh integ cat || true
            echo "======== LEG B: old same-vc secure -> new secure (SAME versionCode -> dexfp path) ========"
            adb uninstall ${{ inputs.package }} || true; sleep 2
            adb install apks/old5/secure.apk && echo OLD5_INSTALLED || echo OLD5_INSTALL_FAIL
            adb logcat -c || true; adb shell monkey -p ${{ inputs.package }} -c android.intent.category.LAUNCHER 1 || true; sleep 14; adb shell pidof ${{ inputs.package }} && echo OLD5_OK || echo OLD5_DEAD
            adb shell dumpsys package ${{ inputs.package }} | grep -E "versionCode|versionName" || true
            echo "-- sa_integ after OLD5 first open (baseline art= should be recorded):"; /tmp/gs.sh integ cat || true
            adb install -r apks/new/secure.apk && echo UPD_SAME_VC_INSTALLED || echo UPD_SAME_VC_INSTALL_FAIL
            adb logcat -c || true; adb shell monkey -p ${{ inputs.package }} -c android.intent.category.LAUNCHER 1 || true; sleep 14; adb shell pidof ${{ inputs.package }} && echo UPD_SAME_VC_OK || echo UPD_SAME_VC_DEAD
            adb shell dumpsys package ${{ inputs.package }} | grep -E "versionCode|versionName" || true
            adb logcat -d -s AndroidRuntime:E | tail -n 60 || true
            adb logcat -d | grep -E "FATAL|AssertionError|secureapp|dex2oat" | tail -n 60 || true
            echo "-- sa_integ after same-vc update open:"; /tmp/gs.sh integ cat || true
            echo "-- sa_crash after same-vc update open:"; /tmp/gs.sh crash cat || true
            adb shell am force-stop ${{ inputs.package }}; sleep 2; adb logcat -c || true; adb shell monkey -p ${{ inputs.package }} -c android.intent.category.LAUNCHER 1 || true; sleep 14; adb shell pidof ${{ inputs.package }} && echo SECOND_OPEN_OK || echo SECOND_OPEN_DEAD
            adb logcat -d -s AndroidRuntime:E | tail -n 40 || true
            echo "-- sa_integ after second open:"; /tmp/gs.sh integ cat || true
            adb shell "dumpsys package ${{ inputs.package }} | grep -iA3 dexopt" || true
            adb shell "ls -la /data/app/*/${{ inputs.package }}*/oat/*/ 2>/dev/null" || true
            adb shell "cat /data/data/${{ inputs.package }}/shared_prefs/sa_integ.xml 2>/dev/null" || true
