name: Build App (APK + AAB)

# Generic app build: gradle assembleRelease + bundleRelease for ANY app repo,
# signed with the shared keystore, published as a new release on the app repo.
#
# Inputs:
#   repo - app source repo (owner/name)
#   name - asset name prefix (e.g. MyApp -> MyApp.apk / MyApp.aab
#          / MyApp.aab.mapping.txt)
#
# Token rules: xiuxon/* repos use secrets.REPO_TOKEN, any other owner uses
# secrets.EXT_REPO_TOKEN (falls back to REPO_TOKEN when unset).

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'app source repo (owner/name)'
        required: true
      name:
        description: 'release asset name prefix (e.g. MyApp)'
        required: true
      ref:
        description: 'git ref to build (branch/tag/sha; empty = default branch)'
        required: false
        default: ''

permissions:
  contents: read
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      APP_REPO: ${{ inputs.repo }}
      APP_NAME: ${{ inputs.name }}
      GH_TOKEN: ${{ startsWith(inputs.repo, 'xiuxon/') && secrets.REPO_TOKEN || secrets.EXT_REPO_TOKEN }}
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ env.GH_TOKEN }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore keystore
        run: echo "${KEYSTORE_B64}" | base64 -d > keystore.jks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Build APK + AAB
        env:
          KEYSTORE: ${{ github.workspace }}/keystore.jks
          STORE_PASS: ${{ secrets.STORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleRelease bundleRelease

      - name: Publish release to app repo
        run: |
          set -e
          mkdir -p dist
          APK=$(find app/build/outputs/apk -name "*.apk" -type f | grep -v unsigned | head -1)
          AAB=$(find app/build/outputs/bundle -name "*.aab" -type f | head -1)
          echo "APK=$APK AAB=$AAB"
          [ -n "$APK" ] && [ -n "$AAB" ] || { echo "missing build output"; exit 1; }
          cp "$APK" "dist/$APP_NAME.apk"
          cp "$AAB" "dist/$APP_NAME.aab"
          MP=$(find app/build/outputs/mapping -name "mapping.txt" -type f | head -1)
          if [ -n "$MP" ]; then
            cp "$MP" "dist/$APP_NAME.aab.mapping.txt"
            echo "AGP mapping: $(wc -l < "dist/$APP_NAME.aab.mapping.txt") lines"
          else
            echo "WARN: AGP mapping.txt not found"
          fi
          file "dist/$APP_NAME.apk"
          ls -l dist
          TAG="apk-$(date +%Y%m%d-%H%M%S)"
          ASSETS=("dist/$APP_NAME.apk" "dist/$APP_NAME.aab")
          [ -f "dist/$APP_NAME.aab.mapping.txt" ] && ASSETS+=("dist/$APP_NAME.aab.mapping.txt")
          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "$APP_REPO" --title "$APP_NAME $TAG" \
            --notes "APK + AAB built on public runner; assets stay on the app repo." \
            --generate-notes

  purge-logs:
    runs-on: ubuntu-latest
    needs: [build-apk]
    if: ${{ needs.build-apk.result == 'success' }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete all workflow runs (logs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REPO="$GITHUB_REPOSITORY"
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[].id' > /tmp/run_ids.txt || true
          while read -r id; do
            [ -z "$id" ] && continue
            echo "deleting run $id"
            gh api -X DELETE "repos/$REPO/actions/runs/$id" || true
          done < /tmp/run_ids.txt
          gh api -X DELETE "repos/$REPO/actions/runs/$GITHUB_RUN_ID" || true
          echo "purge done"
