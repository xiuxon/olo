name: Build Secure APK

# Generic secure-app hardening build.
# Fetches a plain APK (and optionally a plain AAB) from the app repo named in
# config/<app>.json, runs the secure-app pipeline (guard + strings + integrity),
# verifies the result and uploads the hardened asset back to the app repo.
#
# Token rules: xiuxon/* repos use secrets.REPO_TOKEN, any other owner uses
# secrets.EXT_REPO_TOKEN (falls back to REPO_TOKEN when unset).

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'config name (config/<name>.json in secure-app)'
        required: true
      tag:
        description: 'source release tag (blank = latest)'
        required: false
        default: ''

permissions:
  contents: read
  actions: write

jobs:
  secure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout secure-app
        uses: actions/checkout@v4
        with:
          repository: xiuxon/secure-app
          token: ${{ secrets.REPO_TOKEN }}
          persist-credentials: false

      - name: Validate config
        run: |
          set -e
          test -f "config/${{ inputs.app }}.json" || { echo "config/${{ inputs.app }}.json not found"; ls config; exit 1; }
          python3 -c "
          import json
          c = json.load(open('config/${{ inputs.app }}.json'))
          for k in ('input', 'output'):
              assert c.get(k, {}).get('repo'), k + '.repo missing'
              assert c.get(k, {}).get('asset'), k + '.asset missing'
          print('config OK: in=%s out=%s' % (c['input']['repo'], c['output']['asset']))
          "

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore keystore
        run: echo "$KEYSTORE_B64" | base64 -d > /tmp/keystore.jks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Fetch tools (apktool + R8 + dex2jar + SDK paths)
        run: |
          set -e
          curl -sL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          curl -sL -o /tmp/r8.jar https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.3.37/r8-8.3.37.jar
          curl -sL -o /tmp/dex-tools.zip https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip
          unzip -q /tmp/dex-tools.zip -d /tmp/d2j
          chmod +x /tmp/d2j/dex-tools-v2.4/d2j-dex2jar.sh
          ls -l /tmp/apktool.jar /tmp/r8.jar /tmp/d2j/dex-tools-v2.4/d2j-dex2jar.sh
          AJ=$(ls "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "ANDROID_JAR=$AJ" >> "$GITHUB_ENV"
          echo "APKSIGNER=${BT}apksigner" >> "$GITHUB_ENV"
          echo "ZIPALIGN=${BT}zipalign" >> "$GITHUB_ENV"
          echo "DEX2JAR=/tmp/d2j/dex-tools-v2.4/d2j-dex2jar.sh" >> "$GITHUB_ENV"
          echo "using $AJ / $BT"

      - name: Android NDK (pack libpk.so - only when config has pack.enabled)
        run: |
          set -e
          PACK=$(python3 -c "import json,sys;print(bool((json.load(open(sys.argv[1])).get('pack') or {}).get('enabled')))" "config/${{ inputs.app }}.json")
          if [ "$PACK" != "True" ]; then echo "pack disabled - skip NDK"; exit 0; fi
          FOUND=""
          for d in ${ANDROID_NDK_HOME:-} ${ANDROID_NDK_ROOT:-} ${ANDROID_NDK:-} ${ANDROID_NDK_LATEST_HOME:-} "$ANDROID_HOME"/ndk/*; do
            [ -n "$d" ] && [ -d "$d" ] || continue
            if [ -x "$d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" ]; then FOUND="$d"; fi
          done
          if [ -z "$FOUND" ]; then
            echo "no preinstalled NDK - installing ndk;27.0.12077973"
            yes | sdkmanager --install "ndk;27.0.12077973" >/dev/null 2>&1 || true
            for d in "$ANDROID_HOME"/ndk/*; do
              [ -x "$d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" ] && FOUND="$d"
            done
          fi
          [ -n "$FOUND" ] || { echo "NDK setup failed - pack needs clang"; exit 1; }
          echo "ANDROID_NDK_HOME=$FOUND" >> "$GITHUB_ENV"
          echo "NDK: $FOUND"

      - name: Fetch plain APK
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          EXT_REPO_TOKEN: ${{ secrets.EXT_REPO_TOKEN }}
        run: |
          set -e
          IN_REPO=$(python3 -c "import json;print(json.load(open('config/${{ inputs.app }}.json'))['input']['repo'])")
          case "$IN_REPO" in xiuxon/*) GH_TOKEN="$REPO_TOKEN";; *) GH_TOKEN="${EXT_REPO_TOKEN:-$REPO_TOKEN}";; esac
          export GH_TOKEN
          python3 tools/fetch.py --config "config/${{ inputs.app }}.json" \
            --out /tmp/plain.apk --tag "${{ inputs.tag }}" --tagfile /tmp/src_tag.txt

      - name: Fetch plain bundle (AAB configs only)
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          EXT_REPO_TOKEN: ${{ secrets.EXT_REPO_TOKEN }}
        run: |
          set -e
          eval "$(python3 -c "
          import json
          c = json.load(open('config/${{ inputs.app }}.json'))
          print('IN_REPO=%s' % c['input']['repo'])
          out = c['output']
          want_aab = out['asset'].endswith('.aab') or (out.get('aab_asset') or '').endswith('.aab')
          print('OUT_AAB=%s' % ('1' if want_aab else '0'))
          print('AAB_ASSET=%s' % c['input'].get('aab_asset', ''))
          ")"
          if [ "$OUT_AAB" != "1" ]; then echo "apk output - skip bundle fetch"; exit 0; fi
          [ -n "$AAB_ASSET" ] || { echo "input.aab_asset missing in config"; exit 1; }
          case "$IN_REPO" in xiuxon/*) GH_TOKEN="$REPO_TOKEN";; *) GH_TOKEN="${EXT_REPO_TOKEN:-$REPO_TOKEN}";; esac
          export GH_TOKEN
          # same tag as the apk -> plain apk + plain bundle from ONE release
          python3 tools/fetch.py --config "config/${{ inputs.app }}.json" \
            --out /tmp/plain.aab --tag "$(cat /tmp/src_tag.txt)" --asset "$AAB_ASSET"

      - name: Harden (guard + strings + obfuscate)
        env:
          STORE_PASS: ${{ secrets.STORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          set -e
          CFG="config/${{ inputs.app }}.json"
          # pass 1: sideload artifact (config default self_digest - baked
          # full-APK digest compare, strongest for direct installs)
          # pass 2: Play bundle (baseline self-digest - Play re-packs the
          # bundle so a baked digest can never match; the dex is transplanted
          # into the plain bundle + jarsigner, the pass's APK sibling is
          # discarded - only the sideload APK from pass 1 ships)
          # (function instead of a $COMMON string: store pass / key alias
          # contain spaces and must stay single argv entries)
          run_harden() {
            python3 tools/harden.py --config "$CFG" --apk /tmp/plain.apk \
              --apktool /tmp/apktool.jar --r8 /tmp/r8.jar \
              --dex2jar "$DEX2JAR" --android-jar "$ANDROID_JAR" \
              --zipalign "$ZIPALIGN" --apksigner "$APKSIGNER" \
              --keystore /tmp/keystore.jks --ks-pass "$STORE_PASS" \
              --alias "$KEY_ALIAS" "$@"
          }
          run_harden --out /tmp/secure.apk
          if [ -f /tmp/plain.aab ]; then
            run_harden --out /tmp/secure_play_pass.apk \
              --self-digest baseline --aab /tmp/plain.aab --out-aab /tmp/play.aab
          fi

      - name: Verify hardened APK (+ bundle when built)
        run: |
          python3 tools/verify.py --apk /tmp/secure.apk \
            --config "config/${{ inputs.app }}.json"
          if [ -f /tmp/play.aab ]; then
            python3 tools/verify.py --apk /tmp/play.aab \
              --config "config/${{ inputs.app }}.json" --self-digest baseline
          fi

      - name: Upload hardened output to release
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          EXT_REPO_TOKEN: ${{ secrets.EXT_REPO_TOKEN }}
        run: |
          set -e
          TAG=$(cat /tmp/src_tag.txt)
          eval "$(python3 -c "
          import json
          c = json.load(open('config/${{ inputs.app }}.json'))['output']
          print('OUT_REPO=%s' % c['repo'])
          print('OUT_ASSET=%s' % c['asset'])
          print('OUT_AAB_ASSET=%s' % (c.get('aab_asset') or ''))
          ")"
          case "$OUT_REPO" in xiuxon/*) GH_TOKEN="$REPO_TOKEN";; *) GH_TOKEN="${EXT_REPO_TOKEN:-$REPO_TOKEN}";; esac
          export GH_TOKEN
          if [ "${OUT_ASSET##*.}" = "aab" ]; then SRC=/tmp/play.aab; else SRC=/tmp/secure.apk; fi
          [ -f "$SRC" ] || { echo "expected output missing: $SRC"; exit 1; }
          cp "$SRC" "/tmp/$OUT_ASSET"
          ls -l "/tmp/$OUT_ASSET"
          gh release upload "$TAG" "/tmp/$OUT_ASSET" --repo "$OUT_REPO" --clobber
          echo "uploaded $OUT_ASSET to $OUT_REPO@$TAG"
          # Deobfuscation map for store consoles. Prefer pipeline R8 mapping;
          # when obfuscate is disabled the app dex names come from AGP minify
          # of the plain build - fall back to any AGP mapping on the same tag.
          if [ -f /tmp/secure.apk.mapping.txt ]; then
            cp /tmp/secure.apk.mapping.txt "/tmp/$OUT_ASSET.mapping.txt"
            gh release upload "$TAG" "/tmp/$OUT_ASSET.mapping.txt" --repo "$OUT_REPO" --clobber
            echo "uploaded $OUT_ASSET.mapping.txt (pipeline R8 map)"
          elif [ "${OUT_ASSET##*.}" = "aab" ]; then
            if gh release download "$TAG" --repo "$OUT_REPO" \
                --pattern "*.aab.mapping.txt" --dir /tmp/agpmap 2>/dev/null; then
              M=$(ls /tmp/agpmap/*.aab.mapping.txt 2>/dev/null | head -1)
              if [ -n "$M" ]; then
                cp "$M" "/tmp/$OUT_ASSET.mapping.txt"
                gh release upload "$TAG" "/tmp/$OUT_ASSET.mapping.txt" --repo "$OUT_REPO" --clobber
                echo "uploaded $OUT_ASSET.mapping.txt (AGP minify map from plain build)"
              else
                echo "WARN: no mapping available for $OUT_ASSET (store crash stacks will be obfuscated)"
              fi
            else
              echo "WARN: no mapping available for $OUT_ASSET (store crash stacks will be obfuscated)"
            fi
          else
            echo "NOTE: pipeline R8 skipped (obfuscate off) - no secure APK mapping"
          fi
          # Optional Play bundle twin (output.aab_asset, when the primary
          # output is the sideload apk): upload the hardened bundle under its
          # own asset name + AGP deobfuscation map for Play Console.
          if [ -n "$OUT_AAB_ASSET" ] && [ "$OUT_AAB_ASSET" != "$OUT_ASSET" ]; then
            [ -f /tmp/play.aab ] || { echo "output.aab_asset set but no hardened bundle built"; exit 1; }
            cp /tmp/play.aab "/tmp/$OUT_AAB_ASSET"
            ls -l "/tmp/$OUT_AAB_ASSET"
            gh release upload "$TAG" "/tmp/$OUT_AAB_ASSET" --repo "$OUT_REPO" --clobber
            echo "uploaded $OUT_AAB_ASSET to $OUT_REPO@$TAG"
            if [ -f /tmp/secure_play_pass.apk.mapping.txt ]; then
              cp /tmp/secure_play_pass.apk.mapping.txt "/tmp/$OUT_AAB_ASSET.mapping.txt"
              gh release upload "$TAG" "/tmp/$OUT_AAB_ASSET.mapping.txt" --repo "$OUT_REPO" --clobber
              echo "uploaded $OUT_AAB_ASSET.mapping.txt (pipeline R8 map)"
            else
              rm -rf /tmp/agpmap_aab
              if gh release download "$TAG" --repo "$OUT_REPO" \
                  --pattern "*.aab.mapping.txt" --dir /tmp/agpmap_aab 2>/dev/null; then
                M=$(ls /tmp/agpmap_aab/*.aab.mapping.txt 2>/dev/null | head -1)
                if [ -n "$M" ]; then
                  cp "$M" "/tmp/$OUT_AAB_ASSET.mapping.txt"
                  gh release upload "$TAG" "/tmp/$OUT_AAB_ASSET.mapping.txt" --repo "$OUT_REPO" --clobber
                  echo "uploaded $OUT_AAB_ASSET.mapping.txt (AGP minify map from plain build)"
                else
                  echo "WARN: no mapping available for $OUT_AAB_ASSET (Play crash stacks will be obfuscated)"
                fi
              else
                echo "WARN: no mapping available for $OUT_AAB_ASSET (Play crash stacks will be obfuscated)"
              fi
            fi
          fi

  purge-logs:
    runs-on: ubuntu-latest
    needs: [secure]
    if: ${{ needs.secure.result == 'success' }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete all workflow runs (logs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REPO="$GITHUB_REPOSITORY"
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[].id' > /tmp/run_ids.txt || true
          while read -r id; do
            [ -z "$id" ] && continue
            echo "deleting run $id"
            gh api -X DELETE "repos/$REPO/actions/runs/$id" || true
          done < /tmp/run_ids.txt
          gh api -X DELETE "repos/$REPO/actions/runs/$GITHUB_RUN_ID" || true
          echo "purge done"
