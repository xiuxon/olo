name: Build PC Share (via Kosua)

on:
  workflow_dispatch:

env:
  PCSHARE_REPO: nilow9950/pc-share

permissions:
  contents: read
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private PC Share source
        uses: actions/checkout@v4
        with:
          repository: nilow9950/pc-share
          token: ${{ secrets.XBOX_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore keystore
        run: echo "${XBOX_KEYSTORE_B64}" | base64 -d > keystore.jks
        env:
          XBOX_KEYSTORE_B64: ${{ secrets.XBOX_KEYSTORE_B64 }}

      - name: Build APK + AAB
        env:
          KEYSTORE: ${{ github.workspace }}/keystore.jks
          STORE_PASS: ${{ secrets.XBOX_STORE_PASS }}
          KEY_ALIAS: ${{ secrets.XBOX_KEY_ALIAS }}
        run: gradle assembleRelease bundleRelease

      - name: Publish release to PC Share
        env:
          GH_TOKEN: ${{ secrets.XBOX_REPO_TOKEN }}
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk -name "*.apk" -type f | grep -v unsigned | head -1)
          AAB=$(find app/build/outputs/bundle -name "*.aab" -type f | head -1)
          echo "APK=$APK AAB=$AAB"
          [ -n "$APK" ] && [ -n "$AAB" ] || { echo "missing build output"; exit 1; }
          cp "$APK" dist/PC-Share.apk
          cp "$AAB" dist/PC-Share.aab
          MP=$(find app/build/outputs/mapping -name "mapping.txt" -type f | head -1)
          if [ -n "$MP" ]; then
            cp "$MP" dist/PC-Share.aab.mapping.txt
            echo "AGP mapping: $(wc -l < dist/PC-Share.aab.mapping.txt) lines"
          else
            echo "WARN: AGP mapping.txt not found"
          fi
          file dist/PC-Share.apk
          ls -l dist
          TAG="apk-$(date +%Y%m%d-%H%M%S)"
          ASSETS=(dist/PC-Share.apk dist/PC-Share.aab)
          [ -f dist/PC-Share.aab.mapping.txt ] && ASSETS+=(dist/PC-Share.aab.mapping.txt)
          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "$PCSHARE_REPO" --title "PC Share $TAG" \
            --notes "APK + AAB built on public Kosua runner; assets stay on private pc-share." \
            --generate-notes

  purge-kosua-logs:
    runs-on: ubuntu-latest
    needs: [build-apk]
    if: ${{ needs.build-apk.result == 'success' }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete all Kosua workflow runs (logs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REPO="$GITHUB_REPOSITORY"
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[].id' > /tmp/run_ids.txt || true
          while read -r id; do
            [ -z "$id" ] && continue
            echo "deleting run $id"
            gh api -X DELETE "repos/$REPO/actions/runs/$id" || true
          done < /tmp/run_ids.txt
          gh api -X DELETE "repos/$REPO/actions/runs/$GITHUB_RUN_ID" || true
          echo "purge done"
