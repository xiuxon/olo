name: Build Xbox (via Kosua)

on:
  workflow_dispatch:

env:
  CROSS: aarch64-linux-gnu-
  XBOX_REPO: nilow9950/xbox

permissions:
  contents: read
  actions: write

jobs:
  build-kpm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private Xbox source
        uses: actions/checkout@v4
        with:
          repository: nilow9950/xbox
          token: ${{ secrets.XBOX_REPO_TOKEN }}
          persist-credentials: false

      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Download KernelPatch 0.13.3
        run: |
          curl -sSL -o /tmp/kp.tar.gz https://codeload.github.com/bmax121/KernelPatch/tar.gz/refs/tags/0.13.3
          tar -xzf /tmp/kp.tar.gz -C /tmp

      - name: Build KPM
        run: |
          cd kernel/kpm
          make -B TARGET_COMPILE=aarch64-linux-gnu- KP_DIR=/tmp/KernelPatch-0.13.3/kernel
          file xbox_memreader_4.14.186.kpm
          UNDEF=$(nm -u xbox_memreader_4.14.186.kpm | awk '{print $2}' | tr '\n' ' ')
          echo "undefined: $UNDEF"
          for s in $UNDEF; do
            case "$s" in
              compat_copy_to_user|symbol_lookup_name|kpver) ;;
              *) echo "ERROR: unexpected undefined symbol: $s"; exit 1 ;;
            esac
          done
          if nm -u xbox_memreader_4.14.186.kpm | grep -E 'printk|kallsyms_lookup_name'; then
            echo "ERROR: printk/kallsyms must be resolved at runtime"; exit 1
          fi
          if nm -u xbox_memreader_4.14.186.kpm | grep -q stack_chk; then
            echo "ERROR: __stack_chk_* is not a KP export"; exit 1
          fi
          if readelf -SW xbox_memreader_4.14.186.kpm | grep -q '\.eh_frame'; then
            echo "ERROR: .eh_frame present"; exit 1
          fi
          if readelf -rW xbox_memreader_4.14.186.kpm | grep -q 'R_AARCH64_PREL32'; then
            echo "ERROR: PREL32 present"; exit 1
          fi
          if readelf -rW xbox_memreader_4.14.186.kpm | grep -E 'R_AARCH64_CALL26|R_AARCH64_JUMP26' | grep -E 'compat_copy_to_user|symbol_lookup_name|kpver'; then
            echo "ERROR: CALL26/JUMP26 to KP export"; exit 1
          fi
          echo "OK KPM"

      - name: Publish KPM to Xbox
        env:
          GH_TOKEN: ${{ secrets.XBOX_REPO_TOKEN }}
        run: |
          mkdir -p dist
          cp kernel/kpm/xbox_memreader_4.14.186.kpm dist/
          TAG="kpm-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" dist/xbox_memreader_4.14.186.kpm \
            --repo "$XBOX_REPO" --title "xbox KPM $TAG" \
            --notes "ARM64 KPM (KP 0.13.3). Built on public Kosua runner; asset on private Xbox." \
            --generate-notes

  build-daemon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private Xbox source
        uses: actions/checkout@v4
        with:
          repository: nilow9950/xbox
          token: ${{ secrets.XBOX_REPO_TOKEN }}
          persist-credentials: false

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake ninja-build

      - name: Build daemon
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_C_COMPILER=${CROSS}gcc \
            -DCMAKE_CXX_COMPILER=${CROSS}g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DAEMON=ON -DBUILD_JNI=OFF -DBUILD_KERNEL=OFF
          cmake --build build

      - name: Publish daemon to Xbox
        env:
          GH_TOKEN: ${{ secrets.XBOX_REPO_TOKEN }}
        run: |
          mkdir -p dist
          find build -name 'xbox_daemon' -type f -exec cp {} dist/ \;
          file dist/xbox_daemon
          TAG="daemon-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" dist/xbox_daemon \
            --repo "$XBOX_REPO" --title "xbox daemon $TAG" \
            --notes "ARM64 static daemon." --generate-notes

  build-jni:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private Xbox source
        uses: actions/checkout@v4
        with:
          repository: nilow9950/xbox
          token: ${{ secrets.XBOX_REPO_TOKEN }}
          persist-credentials: false

      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build unzip

      - name: Download NDK r25c
        run: |
          curl -sSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          sudo unzip -q /tmp/ndk.zip -d /opt
          echo "ANDROID_NDK_ROOT=/opt/android-ndk-r25c" >> $GITHUB_ENV

      - name: Build JNI
        run: |
          cmake -B buildjni -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 \
            -DANDROID_NDK="$ANDROID_NDK_ROOT" \
            -DBUILD_DAEMON=OFF -DBUILD_JNI=ON -DBUILD_KERNEL=OFF
          cmake --build buildjni

      - name: Publish JNI to Xbox
        env:
          GH_TOKEN: ${{ secrets.XBOX_REPO_TOKEN }}
        run: |
          mkdir -p dist
          find buildjni -name 'libxbox_daemon_jni.so' -type f -exec cp {} dist/ \;
          file dist/libxbox_daemon_jni.so
          TAG="jni-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" dist/libxbox_daemon_jni.so \
            --repo "$XBOX_REPO" --title "xbox jni bridge $TAG" \
            --notes "ARM64 JNI." --generate-notes

  build-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private Xbox source
        uses: actions/checkout@v4
        with:
          repository: nilow9950/xbox
          token: ${{ secrets.XBOX_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - name: Archive source
        run: git archive --format=tar.gz --prefix=xbox-src/ -o xbox-source.tar.gz HEAD

      - name: Publish source to Xbox
        env:
          GH_TOKEN: ${{ secrets.XBOX_REPO_TOKEN }}
        run: |
          TAG="source-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" xbox-source.tar.gz \
            --repo "$XBOX_REPO" --title "Xbox source $TAG" \
            --notes "Full source archive." --generate-notes

  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Note
        run: echo "kernel .ko built on-device via KPM/APatch"

  build-apk:
    runs-on: ubuntu-latest
    needs: [build-jni, build-kpm]
    steps:
      - name: Checkout private Xbox source
        uses: actions/checkout@v4
        with:
          repository: nilow9950/xbox
          token: ${{ secrets.XBOX_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download JNI + daemon + KPM from Xbox releases
        env:
          GH_TOKEN: ${{ secrets.XBOX_REPO_TOKEN }}
        run: |
          JNI_TAG=$(gh api repos/$XBOX_REPO/releases --paginate | jq -r '[.[] | select(.tag_name | startswith("jni-"))] | sort_by(.created_at) | reverse | .[0].tag_name')
          DAEMON_TAG=$(gh api repos/$XBOX_REPO/releases --paginate | jq -r '[.[] | select(.tag_name | startswith("daemon-"))] | sort_by(.created_at) | reverse | .[0].tag_name')
          KPM_TAG=$(gh api repos/$XBOX_REPO/releases --paginate | jq -r '[.[] | select(.tag_name | startswith("kpm-"))] | sort_by(.created_at) | reverse | .[0].tag_name')
          echo "JNI=$JNI_TAG DAEMON=$DAEMON_TAG KPM=$KPM_TAG"
          [ -n "$JNI_TAG" ] && [ -n "$DAEMON_TAG" ] && [ -n "$KPM_TAG" ] || { echo missing tags; exit 1; }
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets app/src/main/assets/kernel_drivers
          gh release download "$JNI_TAG" --repo "$XBOX_REPO" --pattern 'libxbox_daemon_jni.so' --dir app/src/main/jniLibs/arm64-v8a --clobber
          gh release download "$DAEMON_TAG" --repo "$XBOX_REPO" --pattern 'xbox_daemon' --dir app/src/main/assets --clobber
          gh release download "$KPM_TAG" --repo "$XBOX_REPO" --pattern 'xbox_memreader_4.14.186.kpm' --dir app/src/main/assets/kernel_drivers --clobber
          chmod +x app/src/main/assets/xbox_daemon
          JNI_SIZE=$(wc -c < app/src/main/jniLibs/arm64-v8a/libxbox_daemon_jni.so)
          DAEMON_SIZE=$(wc -c < app/src/main/assets/xbox_daemon)
          KPM_SIZE=$(wc -c < app/src/main/assets/kernel_drivers/xbox_memreader_4.14.186.kpm)
          echo "sizes jni=$JNI_SIZE daemon=$DAEMON_SIZE kpm=$KPM_SIZE"
          [ "$JNI_SIZE" -gt 100000 ] && [ "$DAEMON_SIZE" -gt 1000000 ] && [ "$KPM_SIZE" -gt 1000 ]

      - name: Restore keystore
        run: echo "${XBOX_KEYSTORE_B64}" | base64 -d > keystore.jks
        env:
          XBOX_KEYSTORE_B64: ${{ secrets.XBOX_KEYSTORE_B64 }}

      - name: Build APK
        env:
          KEYSTORE: ${{ github.workspace }}/keystore.jks
          STORE_PASS: ${{ secrets.XBOX_STORE_PASS }}
          KEY_ALIAS: ${{ secrets.XBOX_KEY_ALIAS }}
        run: gradle assembleRelease

      - name: Publish APK to Xbox
        env:
          GH_TOKEN: ${{ secrets.XBOX_REPO_TOKEN }}
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -name "app-release.apk" -type f | head -1)
          if [ -z "$APK" ]; then APK=$(find app/build/outputs/apk -name "*.apk" -type f | grep -v unsigned | head -1); fi
          echo "APK=$APK"
          cp "$APK" dist/Xbox.apk
          file dist/Xbox.apk
          TAG="apk-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" dist/Xbox.apk#Xbox.apk \
            --repo "$XBOX_REPO" --title "Xbox APK $TAG" \
            --notes "Built on Kosua (public free runner); asset on private Xbox." \
            --generate-notes

  purge-kosua-logs:
    runs-on: ubuntu-latest
    needs: [build-kpm, build-daemon, build-jni, build-source, build-kernel, build-apk]
    if: always()
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete all Kosua workflow runs (logs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REPO="$GITHUB_REPOSITORY"
          # Delete every run on this public repo so no logs remain visible
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[].id' > /tmp/run_ids.txt || true
          while read -r id; do
            [ -z "$id" ] && continue
            echo "deleting run $id"
            gh api -X DELETE "repos/$REPO/actions/runs/$id" || true
          done < /tmp/run_ids.txt
          # Best-effort delete self last (may fail if still marked running)
          gh api -X DELETE "repos/$REPO/actions/runs/$GITHUB_RUN_ID" || true
          echo "purge done"
