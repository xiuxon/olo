name: Diagnose Secure APK (emulator)

# Generic secure-APK emulator diagnosis (API 29/30/33).
# Installs the plain APK (control) then the secure APK from an app-repo release
# and runs the standard integrity legs: second open, forced recompile, dexfp
# tamper, pm-clear reset, grant/revoke reopen, optional extra asset, plus
# shared-storage leak check.
#
# Inputs:
#   repo         - app repo holding the release (owner/name)
#   package      - app package name (used for adb + app-private diag paths)
#   tag          - release tag (blank = latest)
#   secure_asset - secure APK asset name (blank = auto-detect *secure*.apk)
#   plain_asset  - plain APK asset name (blank = first non-secure/test/extra apk)
#   extra_asset  - optional extra release asset to install+launch after secure test
#   guide_text   - onboarding page text to look for (blank = skip those markers)
#   guide_btn    - onboarding button text (blank = skip those markers)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'app repo holding the release (owner/name)'
        required: true
      package:
        description: 'app package name'
        required: true
      tag:
        description: 'release tag (blank = latest)'
        required: false
        default: ''
      secure_asset:
        description: 'secure APK asset name (blank = auto-detect)'
        required: false
        default: ''
      plain_asset:
        description: 'plain APK asset name (blank = auto-detect)'
        required: false
        default: ''
      extra_asset:
        description: 'optional extra release asset (blank = skip)'
        required: false
        default: ''
      guide_text:
        description: 'onboarding page text to detect (blank = skip)'
        required: false
        default: ''
      guide_btn:
        description: 'onboarding button text to detect (blank = skip)'
        required: false
        default: ''

permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      APP_REPO: ${{ inputs.repo }}
      GH_TOKEN: ${{ startsWith(inputs.repo, 'xiuxon/') && secrets.REPO_TOKEN || secrets.EXT_REPO_TOKEN }}
      LOG_KEY: ${{ secrets.LOG_KEY }}
      GUIDE_TEXT: ${{ inputs.guide_text }}
      GUIDE_BTN: ${{ inputs.guide_btn }}
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 30, 33]
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download APKs
        run: |
          set -e
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG=$(gh api "repos/$APP_REPO/releases/latest" --jq .tag_name </dev/null); fi
          echo "tag=$TAG"
          mkdir -p apks
          gh api --paginate "repos/$APP_REPO/releases/tags/$TAG" --jq '.assets[].name' > /tmp/assets.txt
          SEC="${{ inputs.secure_asset }}"
          PLN="${{ inputs.plain_asset }}"
          if [ -z "$SEC" ]; then SEC=$(grep -E 'secure.*\.apk$' /tmp/assets.txt | head -1); fi
          if [ -z "$PLN" ]; then PLN=$(grep -E '\.apk$' /tmp/assets.txt | grep -vEi 'extra|test|secure' | head -1); fi
          if [ -z "$SEC" ] || [ -z "$PLN" ]; then
            echo "could not resolve secure/plain apk; candidates were:"
            cat /tmp/assets.txt
            exit 1
          fi
          echo "secure=$SEC plain=$PLN"
          gh release download "$TAG" --repo "$APP_REPO" --pattern "$SEC" --dir apks </dev/null
          mv "apks/$SEC" apks/secure.apk
          gh release download "$TAG" --repo "$APP_REPO" --pattern "$PLN" --dir apks </dev/null
          mv "apks/$PLN" apks/plain.apk
          EXTRA="${{ inputs.extra_asset }}"
          if [ -n "$EXTRA" ]; then
            gh release download "$TAG" --repo "$APP_REPO" --pattern "$EXTRA" --dir apks </dev/null || true
          fi
          PKGSHORT=$(printf '%s' "${{ inputs.package }}" | awk -F. '{print $NF}')
          echo "PKGSHORT=$PKGSHORT" >> "$GITHUB_ENV"
          ls -l apks
          sha256sum apks/*.apk
      - name: Install log decrypt helper
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          set -e
          python3 -c "import cryptography" 2>/dev/null || { pip install --quiet cryptography || pip install --quiet --break-system-packages cryptography; }
          python3 -c "import cryptography" >/dev/null 2>&1 && echo "cryptography OK" || { echo "cryptography MISSING"; exit 1; }
          curl -fsSL -H "Authorization: token $REPO_TOKEN" \
            https://raw.githubusercontent.com/xiuxon/secure-app/main/tools/decrypt_log.py \
            -o /tmp/sa_dec.py && echo "decrypt helper fetched" || { echo "decrypt helper fetch FAILED"; exit 1; }
          cat > /tmp/gs.sh <<'EOF'
          #!/bin/sh
          # gs.sh <integ|crash|/path> <cmd...>
          # Pull an app-private diag file, decrypt ELOG1 (plain passthrough),
          # run cmd on the plaintext. Exit 1 if the file is missing/undecryptable.
          case "$1" in
            integ) R='/data/data/${{ inputs.package }}/files/sa_integ.txt' ;;
            crash) R='/data/data/${{ inputs.package }}/cache/Crash Reports/sa_crash.txt' ;;
            *)     R="$1" ;;
          esac
          shift
          rm -f /tmp/gs_raw /tmp/gs_txt
          if ! adb pull "$R" /tmp/gs_raw >/dev/null 2>&1; then
            echo "(missing: $R)"
            exit 1
          fi
          if ! python3 /tmp/sa_dec.py /tmp/gs_raw > /tmp/gs_txt; then
            echo "(decrypt failed: $R)"
            exit 1
          fi
          exec "$@" /tmp/gs_txt
          EOF
          chmod +x /tmp/gs.sh
          echo "LOG_KEY set: $([ -n "$LOG_KEY" ] && echo yes || echo NO)"
          sh -n /tmp/gs.sh && echo "gs.sh syntax OK"
      - name: Install UI marker helper
        run: |
          cat > /tmp/guide.sh <<'EOF'
          #!/bin/sh
          # guide.sh <uifile> <LABEL> <page|btn>  - marker OK/MISSING/SKIPPED
          F="$1"; L="$2"; M="$3"
          if [ "$M" = "btn" ]; then P="$GUIDE_BTN"; else P="$GUIDE_TEXT"; fi
          if [ -z "$P" ]; then echo "${L}_SKIPPED"; exit 0; fi
          if grep -q "$P" "$F"; then echo "${L}_OK"; else echo "${L}_MISSING"; fi
          EOF
          chmod +x /tmp/guide.sh
          sh -n /tmp/guide.sh && echo "guide.sh syntax OK"
      - name: Install + launch + capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -x
            adb wait-for-device
            adb shell getprop ro.build.version.sdk
            adb shell input keyevent 82 || true
            echo "======== CONTROL: PLAIN APK ========"
            adb shell "find /sdcard -maxdepth 2 -iname \"*${PKGSHORT}*\" -exec rm -rf {} \; 2>/dev/null" || true
            adb install -r apks/plain.apk || true
            adb shell monkey -p ${{ inputs.package }} -c android.intent.category.LAUNCHER 1 || true
            sleep 10
            adb shell pidof ${{ inputs.package }} && echo "PLAIN_OK" || echo "PLAIN_DEAD"
            adb logcat -d -s AndroidRuntime:E > plain_crash.txt || true
            echo "--- plain crash:"; cat plain_crash.txt || true
            adb shell uiautomator dump /sdcard/plain_ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/plain_ui.xml plain_ui.xml >/dev/null 2>&1 || true
            /tmp/guide.sh plain_ui.xml GUIDE_PLAIN page
            /tmp/guide.sh plain_ui.xml GUIDE_PLAIN_BTN btn
            echo "======== PLAIN SECOND OPEN ========"
            adb shell am force-stop ${{ inputs.package }}; sleep 2; adb logcat -c || true; adb shell monkey -p ${{ inputs.package }} -c android.intent.category.LAUNCHER 1 || true; sleep 10; adb shell pidof ${{ inputs.package }} && echo "SECOND_PLAIN_OK" || echo "SECOND_PLAIN_DEAD"; adb logcat -d -s AndroidRuntime:E | tail -n 30 || true
            adb uninstall ${{ inputs.package }} || true
            sleep 2
            echo "======== TEST: SECURE APK ========"
            sha256sum apks/secure.apk
            adb install -r apks/secure.apk
            sleep 2
            adb logcat -c || true
            adb shell monkey -p ${{ inputs.package }} -c android.intent.category.LAUNCHER 1 || true
            sleep 14
            adb shell pidof ${{ inputs.package }} && echo "SECURE_OK" || echo "SECURE_DEAD"
            adb shell uiautomator dump /sdcard/secure_ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/secure_ui.xml secure_ui.xml >/dev/null 2>&1 || true
            /tmp/guide.sh secure_ui.xml GUIDE_SECURE page
            /tmp/guide.sh secure_ui.xml GUIDE_SECURE_BTN btn
            echo "======== SECURE SECOND OPEN ========"
            adb shell am force-stop ${{ inputs.package }}; sleep 2; adb logcat -c || true; adb shell monkey -p ${{ inputs.package }} -c android.intent.category.LAUNCHER 1 || true; sleep 14; adb shell pidof ${{ inputs.package }} && echo "SECOND_SECURE_OK" || echo "SECOND_SECURE_DEAD"; adb logcat -d -s AndroidRuntime:E | tail -n 40 || true; adb logcat -d | grep -E "FATAL|AssertionError|secureapp" | tail -n 40 || true; echo "== sa_integ after 2nd open =="; /tmp/gs.sh integ cat || true
            echo "======== SECURE FORCED RECOMPILE -> THIRD OPEN ========"
            adb shell cmd package compile -m speed -f ${{ inputs.package }} || true; sleep 3; adb shell am force-stop ${{ inputs.package }}; sleep 2; adb logcat -c || true; adb shell monkey -p ${{ inputs.package }} -c android.intent.category.LAUNCHER 1 || true; sleep 14; PIDT=$(adb shell pidof ${{ inputs.package }} | tr -d "\r" || true); echo "pidof_raw=[$PIDT]"; adb logcat -d -s AndroidRuntime:E | grep -q AssertionError && echo "THIRD_RECOMPILE_DIED (should NOT happen with dex_fingerprint)" || echo "THIRD_RECOMPILE_ALIVE (dexfp: legit recompile re-baselined)"; adb logcat -d -s AndroidRuntime:E | tail -n 40 || true; /tmp/gs.sh integ grep -E "rebase\(dex=|dexfp apk=" || true; /tmp/gs.sh integ grep -qF "rebase(dex=" && echo "THIRD_DEXFP_OK (rebase(dex=ok/unp) seen)" || echo "THIRD_DEXFP_MISSING"; echo "== sa_integ after recompile open =="; /tmp/gs.sh integ cat || true
            echo "======== secure prefs (guide flag should be ABSENT on fresh data) ========"
            adb root >/dev/null 2>&1 || true
            sleep 2
            adb shell 'ls /data/data/${{ inputs.package }}/shared_prefs/ 2>/dev/null; cat /data/data/${{ inputs.package }}/shared_prefs/*.xml 2>/dev/null | grep -i "guide\|shown"' || true
            echo "======== secure crash (AndroidRuntime:E) ========"
            adb logcat -d -s AndroidRuntime:E > secure_crash.txt || true
            cat secure_crash.txt || true
            echo "======== secure FATAL/grep ========"
            adb logcat -d | grep -E "FATAL|secureapp|AssertionError|NoClassDefFound|VerifyError|NoSuchMethod" | tail -n 120 || true
            echo "======== our crash file (if any, app-private cache) ========"
            adb root >/dev/null 2>&1 || true
            sleep 2
            /tmp/gs.sh crash cat || true
            echo "======== ART/dexopt diagnostics ========"
            adb logcat -d | grep -iE "dex2oat|installd|dexopt|vdex|checksum|corrupt|not a valid dex" | tail -n 80 || true
            adb shell 'dumpsys package ${{ inputs.package }} | grep -iA3 dexopt' || true
            adb root >/dev/null 2>&1 || true
            sleep 2
            adb shell 'ls -la /data/data/${{ inputs.package }}/ 2>/dev/null; cat /data/data/${{ inputs.package }}/shared_prefs/sa_integ.xml 2>/dev/null' || true
            echo '== sa_integ.txt (filesDir) =='
            /tmp/gs.sh integ cat || true
            echo '== crash file (cache/Crash Reports) =='
            adb shell 'ls -la "/data/data/${{ inputs.package }}/cache/Crash Reports/" 2>/dev/null' || true
            /tmp/gs.sh crash cat || true
            echo '== shared-storage must stay EMPTY (app-private diagnostics standard) =='
            adb shell 'ls /sdcard 2>/dev/null; ls /sdcard/Download 2>/dev/null' | grep -qi "$PKGSHORT" && echo "SHARED_STORAGE_LEAK_FOUND_BROKEN" || echo "NO_SHARED_STORAGE_OK"
            adb shell 'ls -la /data/app/*/${{ inputs.package }}*/ 2>/dev/null; ls -la /data/app/*/${{ inputs.package }}*/oat/*/ 2>/dev/null' || true
            echo "======== EXTRA ASSET TEST (if downloaded) ========"
            EXTRA_APK=$(ls apks/*.apk | grep -vE 'plain\.apk|secure\.apk' | head -n1 || true); if [ -n "$EXTRA_APK" ]; then echo "extra apk: $EXTRA_APK"; sha256sum "$EXTRA_APK"; adb uninstall ${{ inputs.package }} || true; sleep 2; adb install -r "$EXTRA_APK"; sleep 2; adb logcat -c || true; adb shell monkey -p ${{ inputs.package }} -c android.intent.category.LAUNCHER 1 || true; sleep 14; adb shell pidof ${{ inputs.package }} && echo "EXTRA_OK" || echo "EXTRA_DEAD"; adb shell uiautomator dump /sdcard/extra_ui.xml >/dev/null 2>&1 || true; adb pull /sdcard/extra_ui.xml extra_ui.xml >/dev/null 2>&1 || true; /tmp/guide.sh extra_ui.xml GUIDE_EXTRA page; grep -q "UPDATE NOW" extra_ui.xml && echo "EXTRA_DIALOG_UNEXPECTED" || echo "EXTRA_NO_DIALOG_OK"; adb logcat -d -s AndroidRuntime:E | tail -n 40; adb logcat -d | grep -E "FATAL|secureapp|AssertionError|NoClassDefFound|VerifyError" | tail -n 40 || true; echo "======== EXTRA SECOND OPEN ========"; adb shell am force-stop ${{ inputs.package }}; sleep 2; adb logcat -c || true; adb shell monkey -p ${{ inputs.package }} -c android.intent.category.LAUNCHER 1 || true; sleep 14; adb shell pidof ${{ inputs.package }} && echo "SECOND_EXTRA_OK" || echo "SECOND_EXTRA_DEAD"; adb logcat -d -s AndroidRuntime:E | tail -n 40 || true; echo "== sa_integ after EXTRA 2nd open =="; /tmp/gs.sh integ cat || true; else echo "EXTRA_SKIPPED"; fi
            echo "======== FIX: RECOMPILE -> REOPEN (was DEAD) ========"; adb root >/dev/null 2>&1 || true; sleep 2; adb shell cmd package compile -m speed -f ${{ inputs.package }} || true; sleep 3; adb shell am force-stop ${{ inputs.package }}; sleep 2; adb logcat -c || true; adb shell monkey -p ${{ inputs.package }} -c android.intent.category.LAUNCHER 1 || true; sleep 14; PIDF=$(adb shell pidof ${{ inputs.package }} | tr -d "\r" || true); echo "pidof_raw=[$PIDF]"; adb logcat -d -s AndroidRuntime:E | grep -q AssertionError && echo "FIX_RECOMPILE_DIED (should NOT happen with dex_fingerprint)" || echo "FIX_RECOMPILE_ALIVE (dexfp: legit recompile re-baselined)"; adb logcat -d -s AndroidRuntime:E | tail -n 40 || true; /tmp/gs.sh integ grep -qF "rebase(dex=" && echo "FIX_DEXFP_OK" || echo "FIX_DEXFP_MISSING"; echo "== sa_integ after FIX recompile open =="; /tmp/gs.sh integ cat || true
            echo "======== RESET BASELINE (pm clear) so later legs are testable ========"; adb shell pm clear ${{ inputs.package }} || true; sleep 3; adb logcat -c || true; adb shell monkey -p ${{ inputs.package }} -c android.intent.category.LAUNCHER 1 || true; sleep 14; adb shell pidof ${{ inputs.package }} && echo "REBASE_RESET_OK" || echo "REBASE_RESET_DEAD"; /tmp/gs.sh integ cat || true; echo "======== GRANT ALL -> REOPEN (user crash repro) ========"; adb shell pm grant ${{ inputs.package }} android.permission.READ_EXTERNAL_STORAGE || true; adb shell pm grant ${{ inputs.package }} android.permission.WRITE_EXTERNAL_STORAGE || true; adb shell pm grant ${{ inputs.package }} android.permission.ACCESS_FINE_LOCATION || true; adb shell pm grant ${{ inputs.package }} android.permission.POST_NOTIFICATIONS || true; adb shell appops set ${{ inputs.package }} MANAGE_EXTERNAL_STORAGE allow || true; sleep 45; adb shell am force-stop ${{ inputs.package }}; sleep 2; adb logcat -c || true; adb shell monkey -p ${{ inputs.package }} -c android.intent.category.LAUNCHER 1 || true; sleep 14; adb shell pidof ${{ inputs.package }} && echo "GRANT_REOPEN_OK" || echo "GRANT_REOPEN_DEAD"; adb logcat -d -s AndroidRuntime:E | tail -n 40 || true; echo "== sa_integ after grant reopen =="; /tmp/gs.sh integ cat || true
            echo "======== REVOKE STORAGE -> REOPEN (LP feature must DIE) ========"; adb shell pm revoke ${{ inputs.package }} android.permission.READ_EXTERNAL_STORAGE || true; adb shell pm revoke ${{ inputs.package }} android.permission.WRITE_EXTERNAL_STORAGE || true; adb shell appops set ${{ inputs.package }} MANAGE_EXTERNAL_STORAGE deny || true; adb shell am force-stop ${{ inputs.package }}; sleep 2; adb logcat -c || true; adb shell monkey -p ${{ inputs.package }} -c android.intent.category.LAUNCHER 1 || true; sleep 14; adb shell pidof ${{ inputs.package }} && echo "REVOKE_REOPEN_ALIVE_OK" || echo "REVOKE_REOPEN_DIED"; P=$(adb shell pidof ${{ inputs.package }} | tr -d '\r' || true); echo "pidof_raw=[$P]"; if [ -n "$P" ]; then FP=$(echo "$P" | cut -d' ' -f1); adb shell "cut -d' ' -f1-6 /proc/$FP/stat 2>/dev/null; grep -E '^(State|PPid)' /proc/$FP/status 2>/dev/null" || true; fi; adb logcat -d -s AndroidRuntime:E | tail -n 40 || true; echo "== sa_integ after revoke reopen =="; /tmp/gs.sh integ cat || true; /tmp/gs.sh integ grep -q "perm recover" && echo "PERM_RECOVER_OK" || echo "PERM_RECOVER_MISSING"
            echo "======== TAMPER (LP-style): edit dex inside base.vdex -> must DIE (dex=DIFF) ========"; adb root >/dev/null 2>&1 || true; sleep 3; VDEX=$(adb shell 'find /data/app -name base.vdex -path "*${{ inputs.package }}*" 2>/dev/null | head -1' | tr -d "\r"); echo "vdex=[$VDEX]"; if [ -z "$VDEX" ]; then adb shell 'ls -la /data/app/*/${{ inputs.package }}*/oat/*/ 2>/dev/null' || true; fi; if [ -z "$VDEX" ]; then echo "TAMPER_SKIPPED (no base.vdex)"; else STAT=$(adb shell "stat -c '%u:%g' $VDEX" | tr -d "\r"); MODE=$(adb shell "stat -c '%a' $VDEX" | tr -d "\r"); echo "orig owner=$STAT mode=$MODE"; adb pull "$VDEX" /tmp/base.vdex >/dev/null 2>&1; ls -l /tmp/base.vdex || true; cp /tmp/base.vdex /tmp/base_vdex_orig.bin || true; python3 -c 'import re;d=bytearray(open("/tmp/base.vdex","rb").read());hits=[m.start() for m in re.finditer(b"onCreate",bytes(d))] or [m.start() for m in re.finditer(b"androidx",bytes(d))];print("patch_hits",len(hits));[d.__setitem__(h+2,d[h+2]^0x20) for h in hits];open("/tmp/base.vdex","wb").write(bytes(d))' ; echo "patch_rc=$?"; adb push /tmp/base.vdex "$VDEX" >/dev/null 2>&1; adb shell "chown $STAT $VDEX; chmod $MODE $VDEX; restorecon $VDEX" || true; adb shell am force-stop ${{ inputs.package }}; sleep 2; adb logcat -c || true; adb shell monkey -p ${{ inputs.package }} -c android.intent.category.LAUNCHER 1 || true; sleep 14; adb logcat -d -s AndroidRuntime:E | grep -q AssertionError && echo "TAMPER_DIED_OK (dex=DIFF fired)" || echo "TAMPER_ALIVE_BROKEN (fingerprint did not fire)"; adb logcat -d -s AndroidRuntime:E | tail -n 40 || true; /tmp/gs.sh integ grep -E "dex=DIFF|rebase\(dex=|dexfp apk=" || true; /tmp/gs.sh integ grep -qF "dex=DIFF" && echo "TAMPER_MARKER_OK" || echo "TAMPER_MARKER_MISSING"; echo "== sa_integ after TAMPER open =="; /tmp/gs.sh integ cat || true; fi

      - name: vdex fpDex analysis (runner side)
        if: always()
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          ls -l /tmp/base_vdex_orig.bin /tmp/base.vdex 2>/dev/null || echo "no pulled vdex"
          curl -fsSL -H "Authorization: token $REPO_TOKEN" \
            https://raw.githubusercontent.com/xiuxon/secure-app/main/tools/vdex_diag.py \
            -o /tmp/vdex_diag.py && echo "analyzer fetched" || echo "analyzer fetch FAILED"
          for f in /tmp/base_vdex_orig.bin /tmp/base.vdex; do
            if [ -f "$f" ]; then
              echo "===== $f ====="
              python3 /tmp/vdex_diag.py "$f" apks/secure.apk || echo "analyzer rc=$?"
            fi
          done
          if [ -f /tmp/base_vdex_orig.bin ]; then
            python3 - <<'PY'
          import struct
          b = open("/tmp/base_vdex_orig.bin", "rb").read()
          def ru32(o): return struct.unpack_from("<I", b, o)[0]
          def hx(o, n=48):
              c = b[o:o+n]
              return c.hex() + " | " + "".join(chr(x) if 32 <= x < 127 else "." for x in c)
          def uleb(o):
              s = 0; sh = 0; i = o
              while i < len(b):
                  v = b[i]; i += 1; s |= (v & 127) << sh
                  if not v & 128: break
                  sh += 7
              return s, i
          print("PROBE vdex len", len(b), "head64", hx(0, 64))
          imgs = []
          for mg in (b"cdex001\x00", b"dex\n035\x00"):
              i = 0
              while True:
                  j = b.find(mg, i)
                  if j < 0: break
                  imgs.append((mg[:4].decode("latin1"), j)); i = j + 1
          for kind, base in sorted(imgs, key=lambda x: x[1]):
              if base + 112 > len(b): continue
              fsz = ru32(base + 32); hs = ru32(base + 36)
              if hs not in (0x70, 0x88) or fsz < 0x70 or base + fsz > len(b):
                  print("PROBE", kind, "@", base, "skip hs=%#x fsz=%d" % (hs, fsz)); continue
              strN = ru32(base + 56); strOff = ru32(base + 60)
              dataSz = ru32(base + 104); dataOff = ru32(base + 108); mapOff = ru32(base + 52)
              print("PROBE %s @%d fsz=%d hs=%#x strN=%d strOff=%d dataSz=%d dataOff=%d mapOff=%d" % (kind, base, fsz, hs, strN, strOff, dataSz, dataOff, mapOff))
              if kind == "cdex" and strN > 0 and strOff + 4 <= fsz:
                  str0 = ru32(base + strOff)
                  print("PROBE  str0=%d ext=%s" % (str0, [hex(ru32(base + o)) for o in range(112, 136, 4)]))
                  for nm, abs_ in (("filerel", base + str0), ("datarel", base + dataOff + str0), ("vdexabs", str0)):
                      if 0 <= abs_ < len(b) - 4:
                          try:
                              ln, pos = uleb(abs_)
                              print("PROBE   %s abs=%d uleb=%d %s" % (nm, abs_, ln, hx(abs_)))
                          except Exception as e:
                              print("PROBE   %s abs=%d err=%s" % (nm, abs_, e))
                      else:
                          print("PROBE   %s abs=%d OOB len=%d" % (nm, abs_, len(b)))
          PY
            TAGU="${{ inputs.tag }}"
            if [ -z "$TAGU" ]; then TAGU=$(gh api "repos/$APP_REPO/releases/latest" --jq .tag_name </dev/null); fi
            cp /tmp/base_vdex_orig.bin "/tmp/probe-vdex-api${{ matrix.api-level }}.bin" || echo "cp FAILED rc=$?"
            gh release upload "$TAGU" "/tmp/probe-vdex-api${{ matrix.api-level }}.bin" --repo "$APP_REPO" --clobber </dev/null && echo "vdex uploaded api${{ matrix.api-level }}" || echo "vdex upload FAILED rc=$?"
          fi
